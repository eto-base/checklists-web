<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чеклисты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ============================================================
   Чеклисты — Акварельная бумага & стикеры
   Pinking-shear edges · stickers · ink drops · paper grain
   ============================================================ */

:root {
  --bg: #E8DFD4;
  --surface: #FBF7F0;
  --surface-2: #F0E8DC;
  --text: #2C2419;
  --text-secondary: #5C5348;
  --text-muted: #8A8074;
  --border: #D4C8B8;
  --border-strong: #C4B5A2;
  --accent: #C45C26;
  --accent-hover: #A3481C;
  --accent-soft: rgba(196, 92, 38, 0.14);
  --accent-glow: rgba(196, 92, 38, 0.28);
  --success: #3D7A4A;
  --success-soft: rgba(61, 122, 74, 0.14);
  --danger: #B83A3A;
  --danger-soft: rgba(184, 58, 58, 0.12);
  --warning: #C4892A;
  --warning-soft: rgba(196, 137, 42, 0.14);
  --shadow: 0 2px 4px rgba(44, 36, 25, 0.06);
  --shadow-md: 0 6px 18px rgba(44, 36, 25, 0.10);
  --shadow-lg: 0 14px 40px rgba(44, 36, 25, 0.14);
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-pill: 999px;
  --nav-height: 68px;
  --header-height: 54px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --font: "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-ui: var(--font);
  --ease: cubic-bezier(.34, 1.2, .64, 1);
  --line-w: 1.5px;
  --bg-card: var(--surface);
  --bg-input: var(--surface);
  --primary: var(--accent);
  --primary-soft: var(--accent-soft);
  --glass: var(--surface);
  --glass-border: var(--border);
  --menu-item: transparent;
  --menu-item-active: var(--accent-soft);
  --overlay-bg: rgba(44, 36, 25, 0.35);
  --sticker-rot: -0.6deg;
  --paper-noise: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
}

[data-theme="dark"] {
  --bg: #1A1714;
  --surface: #25211C;
  --surface-2: #2E2923;
  --text: #F5EFE6;
  --text-secondary: #B5A99A;
  --text-muted: #7A7166;
  --border: #3A342C;
  --border-strong: #4A433A;
  --accent: #E07A3D;
  --accent-hover: #F08A4D;
  --accent-soft: rgba(224, 122, 61, 0.18);
  --accent-glow: rgba(224, 122, 61, 0.3);
  --success: #5A9A68;
  --success-soft: rgba(90, 154, 104, 0.16);
  --danger: #D45A5A;
  --danger-soft: rgba(212, 90, 90, 0.16);
  --warning: #D4A04A;
  --warning-soft: rgba(212, 160, 74, 0.16);
  --shadow: 0 2px 4px rgba(0,0,0,.4);
  --shadow-md: 0 6px 18px rgba(0,0,0,.45);
  --shadow-lg: 0 14px 40px rgba(0,0,0,.55);
  --overlay-bg: rgba(0,0,0,.55);
}

[data-accent="blue"]   { --accent:#3B6EA5; --accent-hover:#2F5A8A; --accent-soft:rgba(59,110,165,.14); --accent-glow:rgba(59,110,165,.25); }
[data-accent="violet"] { --accent:#7B5EA7; --accent-hover:#654C8C; --accent-soft:rgba(123,94,167,.14); --accent-glow:rgba(123,94,167,.25); }
[data-accent="teal"]   { --accent:#3D8B7A; --accent-hover:#2F6F62; --accent-soft:rgba(61,139,122,.14); --accent-glow:rgba(61,139,122,.25); }
[data-accent="orange"] { --accent:#C45C26; --accent-hover:#A3481C; --accent-soft:rgba(196,92,38,.14); --accent-glow:rgba(196,92,38,.28); }
[data-accent="pink"]   { --accent:#B85A7A; --accent-hover:#9A4A66; --accent-soft:rgba(184,90,122,.14); --accent-glow:rgba(184,90,122,.25); }
[data-accent="green"]  { --accent:#4A8B5C; --accent-hover:#3A704A; --accent-soft:rgba(74,139,92,.14); --accent-glow:rgba(74,139,92,.25); }

[data-theme="dark"][data-accent="blue"]   { --accent:#5B8EC5; --accent-hover:#7AA5D5; }
[data-theme="dark"][data-accent="violet"] { --accent:#9B7EC7; --accent-hover:#B598D7; }
[data-theme="dark"][data-accent="teal"]   { --accent:#5DAB9A; --accent-hover:#7DCBB8; }
[data-theme="dark"][data-accent="orange"] { --accent:#E07A3D; --accent-hover:#F08A4D; }
[data-theme="dark"][data-accent="pink"]   { --accent:#D87A9A; --accent-hover:#E89AAA; }
[data-theme="dark"][data-accent="green"]  { --accent:#6AAB7C; --accent-hover:#8ACB9C; }

/* Visual prefs */
[data-font="typewriter"] body, [data-font="typewriter"] button, [data-font="typewriter"] input,
[data-font="typewriter"] select, [data-font="typewriter"] textarea {
  font-family: "Courier New", Courier, monospace !important;
  letter-spacing: 0.02em;
}
[data-font="script"] body, [data-font="script"] h1, [data-font="script"] h2, [data-font="script"] .topbar-title {
  font-family: "Segoe Script", "Brush Script MT", cursive !important;
}
[data-font="office"] body {
  font-family: "Times New Roman", Times, serif !important;
}
[data-line="thin"]  { --line-w: 1px; }
[data-line="medium"]{ --line-w: 1.5px; }
[data-line="thick"] { --line-w: 2.5px; }
[data-line="dashed"] .card, [data-line="dashed"] .list-group, [data-line="dashed"] .folder,
[data-line="dashed"] .bottom-nav, [data-line="dashed"] input, [data-line="dashed"] .chip {
  border-style: dashed !important;
}

[data-contrast="high"] { --text-secondary: var(--text); --text-muted: var(--text-secondary); }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-ui);
  background: var(--bg);
  background-image: var(--paper-noise);
  color: var(--text);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
#app { min-height: 100%; }

/* Pinking-shear (zigzag) edge via mask on cards */
.card, .login-card, .list-group, .empty-icon, .stub-icon {
  position: relative;
}

/* Auth */
#login-screen, #tfa-screen, #forgot-screen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 24px 16px; background: var(--bg); background-image: var(--paper-noise);
}
.login-card {
  width: 100%; max-width: 380px; background: var(--surface);
  border-radius: 4px 18px 8px 14px;
  padding: 32px 24px 26px;
  box-shadow: var(--shadow-lg), 3px 4px 0 rgba(44,36,25,0.06);
  border: var(--line-w) solid var(--border-strong);
  transform: rotate(-0.4deg);
}
.login-logo {
  width: 56px; height: 56px; border-radius: 50% 40% 50% 45%;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 18px; font-size: 26px; font-weight: 700;
  box-shadow: 2px 3px 0 rgba(0,0,0,0.08);
}
.login-card h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 6px; }
.login-card .subtitle { color: var(--text-secondary); font-size: 15px; margin-bottom: 22px; }

/* Shell */
#app-screen { display: flex; flex-direction: column; min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 40; height: var(--header-height);
  background: color-mix(in srgb, var(--surface) 90%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: var(--line-w) solid var(--border);
  display: flex; align-items: center; padding: 0 6px 0 4px; gap: 2px;
}
.topbar-btn {
  width: 44px; height: 44px; border: none; background: transparent; border-radius: 12px;
  color: var(--accent); display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; position: relative; overflow: hidden;
}
.topbar-btn:active { background: var(--accent-soft); }
.topbar-btn svg { width: 22px; height: 22px; }
.topbar-btn.muted { color: var(--text-secondary); }
.topbar-title {
  flex: 1; font-size: 17px; font-weight: 700; letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px;
}
.topbar-actions { display: flex; align-items: center; }
.ws-select {
  max-width: 120px; padding: 6px 10px; font-size: 13px; font-weight: 500;
  border-radius: 10px; border: var(--line-w) solid var(--border-strong);
  background: var(--surface-2); color: var(--text); font-family: inherit; margin-right: 4px;
}

/* Overlay + side */
.overlay {
  position: fixed; inset: 0; background: var(--overlay-bg); z-index: 50;
  opacity: 0; pointer-events: none; transition: opacity .22s var(--ease);
}
.overlay.open { opacity: 1; pointer-events: auto; }
.sidemenu {
  position: fixed; top: 0; left: 0; bottom: 0; width: min(300px, 88vw); z-index: 60;
  transform: translateX(-105%); transition: transform .28s var(--ease);
  display: flex; flex-direction: column; background: var(--surface);
  border-right: var(--line-w) solid var(--border); box-shadow: var(--shadow-lg);
  padding: 8px 10px 12px;
  background-image: var(--paper-noise);
}
.sidemenu.open { transform: translateX(0); }
.side-close {
  position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%;
  border: none; background: var(--surface-2); color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.side-profile {
  display: flex; align-items: center; gap: 12px; padding: 14px 12px; margin: 28px 0 8px;
  border-radius: 14px 8px 16px 10px; background: var(--surface-2); cursor: pointer;
  border: var(--line-w) solid var(--border); transform: rotate(0.3deg);
}
.side-profile:active { background: var(--accent-soft); }
.side-profile .avatar {
  width: 48px; height: 48px; border-radius: 50% 42% 50% 48%; background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px;
  flex-shrink: 0; position: relative; overflow: hidden;
}
.side-profile .avatar img { width: 100%; height: 100%; object-fit: cover; }
.side-profile .online {
  position: absolute; right: 1px; bottom: 1px; width: 11px; height: 11px;
  background: var(--success); border: 2px solid var(--surface); border-radius: 50%;
}
.side-profile-text { flex: 1; min-width: 0; }
.side-profile-name { font-weight: 600; font-size: 16px; }
.side-profile-sub { font-size: 13px; color: var(--text-secondary); margin-top: 1px; }
.side-profile-mail { font-size: 12px; color: var(--text-muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidemenu-nav { flex: 1; overflow-y: auto; padding: 4px 0; }
.sidemenu-section { font-size: 11px; font-weight: 600; color: var(--text-muted); padding: 14px 12px 6px; letter-spacing: .06em; text-transform: uppercase; }
.sidemenu-item {
  display: flex; align-items: center; gap: 12px; padding: 12px;
  margin-bottom: 3px; border-radius: 12px 8px 14px 10px; border: none; background: transparent;
  color: var(--text); font-size: 15px; font-weight: 500; width: 100%;
  text-align: left; cursor: pointer; font-family: inherit; min-height: 44px;
  transition: transform .2s var(--ease), background .15s, box-shadow .2s;
}
.sidemenu-item:active, .sidemenu-item.active {
  background: var(--surface);
  box-shadow: 0 4px 12px rgba(44,36,25,0.1), 0 1px 0 var(--border);
  transform: translateY(-2px) rotate(-0.5deg);
}
.sidemenu-item.active { color: var(--accent); border: var(--line-w) solid var(--accent-soft); }
.sidemenu-item svg { width: 20px; height: 20px; flex-shrink: 0; opacity: .9; }
.sidemenu-item .chev { margin-left: auto; opacity: .35; font-size: 16px; }
.sidemenu-item .soon { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 8px; }
.sidemenu-footer { padding-top: 6px; border-top: var(--line-w) solid var(--border); margin-top: 4px; }
.sidemenu-item.logout { color: var(--danger); }

#view {
  flex: 1; padding: 14px 14px calc(var(--nav-height) + var(--safe-bottom) + 32px);
  max-width: 560px; margin: 0 auto; width: 100%;
}

/* Dock as stickers */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; justify-content: center; align-items: flex-end;
  padding: 0 14px calc(12px + var(--safe-bottom));
  pointer-events: none;
}
[data-dock="left"] .dock {
  left: 0; right: auto; top: 50%; bottom: auto; transform: translateY(-50%);
  flex-direction: column; padding: 12px; width: auto;
}
[data-dock="right"] .dock {
  right: 0; left: auto; top: 50%; bottom: auto; transform: translateY(-50%);
  flex-direction: column; padding: 12px; width: auto;
}
[data-dock="left"] .bottom-nav,
[data-dock="right"] .bottom-nav {
  flex-direction: column; height: auto; width: 58px; max-width: 58px;
  border-radius: 18px; padding: 6px;
}
[data-dock="left"] .bottom-nav button,
[data-dock="right"] .bottom-nav button {
  min-height: 48px; width: 100%;
}
[data-dock="left"] .orbs,
[data-dock="right"] .orbs {
  flex-direction: column; margin: 8px 0 0 0;
}
[data-dock="left"] #view { padding-left: 80px; }
[data-dock="right"] #view { padding-right: 80px; }

.bottom-nav {
  pointer-events: auto;
  height: 60px;
  background: var(--surface);
  border: var(--line-w) solid var(--border-strong);
  border-radius: 22px 18px 24px 16px;
  box-shadow: var(--shadow-lg), 2px 3px 0 rgba(44,36,25,0.05);
  display: flex; align-items: center;
  padding: 4px;
  max-width: 320px;
  width: 100%;
  transform: rotate(-0.3deg);
  background-image: var(--paper-noise);
  transition: transform .25s var(--ease), box-shadow .25s;
}
.bottom-nav:has(button.active) {
  transform: rotate(0deg) translateY(-3px);
  box-shadow: var(--shadow-lg), 0 6px 0 rgba(44,36,25,0.04);
}
.bottom-nav button {
  flex: 1; border: none; background: transparent; color: var(--text-muted);
  font-size: 10px; font-weight: 600; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; cursor: pointer;
  font-family: inherit; padding: 6px 4px; min-height: 52px; border-radius: 16px;
  transition: color .15s, background .15s, transform .2s var(--ease);
  position: relative; overflow: hidden;
}
.bottom-nav button.active {
  color: var(--accent);
  background: var(--accent-soft);
  transform: translateY(-2px) rotate(-1deg);
  box-shadow: 0 2px 6px rgba(44,36,25,0.08);
}
.bottom-nav button svg { width: 22px; height: 22px; transition: transform .2s; }
.bottom-nav button.active svg { transform: scale(1.08) rotate(-3deg); }

.orbs { display: flex; gap: 8px; margin-left: 10px; pointer-events: auto; }
.search-orb {
  width: 50px; height: 50px; border-radius: 50% 45% 50% 48%;
  border: var(--line-w) solid var(--border-strong);
  background: var(--surface); color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-md), 2px 2px 0 rgba(44,36,25,0.05);
  cursor: pointer; flex-shrink: 0;
  transition: transform .2s var(--ease), box-shadow .2s;
  position: relative; overflow: hidden;
}
.search-orb:active, .search-orb.active {
  transform: translateY(-3px) rotate(2deg);
  background: var(--accent-soft); color: var(--accent);
  box-shadow: 0 6px 14px rgba(44,36,25,0.12);
}
.plus-orb { background: var(--accent); color: #fff; border-color: var(--accent); }
.plus-orb:active { background: var(--accent-hover); }

/* Typography */
h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 4px; }
h2 { font-size: 11px; font-weight: 600; margin: 22px 0 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .07em; }
.page-desc { color: var(--text-secondary); font-size: 14px; margin-bottom: 14px; }
label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin: 14px 0 6px; }
input, select, textarea, button { font-family: inherit; font-size: 16px; }

input[type="text"], input[type="email"], input[type="password"], input[type="number"],
input[type="datetime-local"], input[type="search"], input[type="file"], select, textarea {
  width: 100%; padding: 13px 16px; border-radius: 10px 14px 8px 12px;
  border: var(--line-w) solid var(--border-strong); background: var(--surface); color: var(--text);
  transition: border-color .15s, box-shadow .15s;
}
input::placeholder, textarea::placeholder { color: var(--text-muted); opacity: 1; }
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
input:disabled, select:disabled, textarea:disabled { opacity: .55; cursor: not-allowed; background: var(--surface-2); }
textarea { resize: vertical; min-height: 88px; }

/* Buttons + ink drop */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 20px; border-radius: 999px; border: none;
  font-weight: 600; font-size: 15px; cursor: pointer; width: 100%; margin-top: 14px;
  letter-spacing: -.01em; min-height: 50px;
  transition: transform .12s, opacity .15s, background .15s;
  position: relative; overflow: hidden;
}
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:active:not(:disabled) { background: var(--accent-hover); }
.btn-secondary {
  background: var(--surface); color: var(--text);
  border: var(--line-w) solid var(--border-strong);
}
.btn-danger { background: var(--danger); color: #fff; }
.btn-ghost {
  background: transparent; color: var(--accent); width: auto;
  padding: 8px 14px; font-size: 15px; font-weight: 500; margin-top: 0;
  min-height: 44px; box-shadow: none;
}
.btn-sm { width: auto; padding: 8px 16px; font-size: 14px; margin-top: 0; border-radius: 999px; min-height: 36px; }

/* Ink drop ripple */
.ink-drop {
  position: absolute; border-radius: 50%;
  background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
  opacity: 0.35; pointer-events: none;
  transform: scale(0); animation: inkAbsorb 0.7s var(--ease) forwards;
}
@keyframes inkAbsorb {
  0%   { transform: scale(0); opacity: 0.45; }
  40%  { opacity: 0.3; }
  100% { transform: scale(2.8); opacity: 0; }
}

/* Cards as cut paper / stickers */
.card {
  background: var(--surface);
  border-radius: 6px 16px 10px 14px;
  padding: 16px 18px; margin-bottom: 12px;
  border: var(--line-w) solid var(--border);
  box-shadow: var(--shadow), 2px 3px 0 rgba(44,36,25,0.04);
  background-image: var(--paper-noise);
  transform: rotate(var(--sticker-rot, -0.4deg));
  transition: transform .2s var(--ease), box-shadow .2s;
}
.card:nth-child(even) { --sticker-rot: 0.5deg; border-radius: 14px 6px 16px 8px; }
.card:nth-child(3n)   { --sticker-rot: -0.8deg; border-radius: 8px 14px 6px 12px; }
.card.click { cursor: pointer; }
.card.click:active {
  transform: rotate(0deg) translateY(-4px) scale(1.01);
  box-shadow: var(--shadow-md), 0 8px 0 rgba(44,36,25,0.03);
}

.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.gap { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.muted { color: var(--text-secondary); font-size: 14px; }
.small { font-size: 12px; color: var(--text-muted); }

.badge {
  display: inline-flex; align-items: center; padding: 4px 11px; border-radius: var(--r-pill);
  font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent); white-space: nowrap;
}
.badge.bad { background: var(--danger-soft); color: var(--danger); }
.badge.ok { background: var(--success-soft); color: var(--success); }
.badge.warn { background: var(--warning-soft); color: var(--warning); }
.badge.neutral { background: var(--surface-2); color: var(--text-secondary); border: 1px solid var(--border); }

.alert { padding: 13px 15px; border-radius: 10px 14px 8px 12px; font-size: 14px; margin-bottom: 12px; line-height: 1.4; border: var(--line-w) solid transparent; }
.alert-info { background: var(--warning-soft); color: #7A5A10; border-color: color-mix(in srgb, var(--warning) 30%, transparent); }
[data-theme="dark"] .alert-info { color: #F5D76E; }
.alert-error { background: var(--danger-soft); color: var(--danger); }
.alert-success { background: var(--success-soft); color: var(--success); word-break: break-all; }

.empty { text-align: center; padding: 48px 24px; color: var(--text-muted); }
.empty-icon {
  width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 40% 50% 45% 55%;
  background: var(--accent-soft); display: flex; align-items: center; justify-content: center; color: var(--accent);
  border: var(--line-w) dashed var(--accent);
}
.empty-icon svg { width: 32px; height: 32px; }
.empty-title { font-size: 16px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }

const SORTS = { due: 'Срок', created: 'Назначен', progress: 'Выполнение', status: 'Статус', title: 'Название' };

function sortRuns(list) {
  const t = (r) => new Date(r.dueAt || 0).getTime() || null;

  const pr = (r) => { const tot = r.itemsCount ?? r.items?.length ?? r._count?.items, dn = r.completedItemsCount; if (r.status === 'COMPLETED') return 1; return tot ? (dn || 0) / tot : 0; };

  const st = (r) => r.overdue ? 0 : (ORD[r.status] ?? 5);
  const ttl = (r) => (r.title || r.template?.title || r.templateTitle || '').toLowerCase();
  const k = runSort.key, m = runSort.dir === 'desc' ? -1 : 1;

  } else if (it.type === 'TEXT') {
    const ta = h('textarea', { rows: 3, disabled: !editable }, it.textValue || '');
    ta.addEventListener('change', () => save({ textValue: ta.value }));
    control = ta;
  } else if (it.type === 'PHOTO') {
    const img = h('img', { class: 'photo hidden' });
    const fid = it.fileId || it.file?.id;
    if (fid) photoURL(fid).then(u => { img.src = u; img.classList.remove('hidden'); }).catch(() => {});
    const inp = h('input', { type: 'file', accept: 'image/*', disabled: !editable });
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      try {
        status.textContent = 'Загружаю…';
        const fd = new FormData();
        fd.append('workspaceId', run.workspaceId || state.wsId);
        fd.append('file', f);
        const up = await api('POST', '/files', fd);
        if (await save({ fileId: up.id })) { img.src = URL.createObjectURL(f); img.classList.remove('hidden'); }
      } catch (e) { status.textContent = ''; toast(e.message, true); }
    };
    control = h('div', {}, inp, img);
  } else control = h('div', { class: 'muted' }, 'Тип: ' + it.type);

  return h('div', { class: 'card' },
    h('div', { class: 'row' }, h('strong', { style: 'font-size:15px' }, it.title), it.required && h('span', { class: 'badge' }, 'обязательно')),
    h('div', { style: 'margin-top:12px' }, control), flag, status);
}

function compressImage(file) {
  return new Promise((res, rej) => {
    if (!file.type.startsWith('image/')) return rej(new Error('Нужно изображение'));
    if (file.size > 10 * 1048576) return rej(new Error('Фото больше 10 МБ'));
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);   // перекодирование убирает EXIF и геометку
      c.toBlob(b => b ? res(b) : rej(new Error('Не удалось обработать фото')), 'image/jpeg', .82);
    };
    img.onerror = () => rej(new Error('Не удалось открыть фото'));
    img.src = u;
  });
}

async function showAssign(t) {
  const users = await loadUsers();
  const selected = new Set();
  const listBox = h('div', { class: 'stack', style: 'margin-top:8px' });
  const due = h('input', { type: 'datetime-local' });

  const renderList = () => {
    listBox.replaceChildren(...(users.length ? users.map(u => {
      const id = u.id;
      const on = selected.has(id);
      return h('div', {
        class: 'choice-opt' + (on ? ' on' : ''),
        onclick: () => { if (selected.has(id)) selected.delete(id); else selected.add(id); renderList(); },
      }, (on ? '✓ ' : '') + personName(u) + (u.nickname ? ` (@${u.nickname})` : ''));
    }) : [h('div', { class: 'alert alert-error' }, 'Нет сотрудников')]));
  };
  renderList();

  setView(
    h('button', { class: 'btn btn-ghost back-btn', onclick: () => go('tpl') }, '← К шаблонам'),
    h('h1', {}, 'Назначить'),
    h('p', { class: 'page-desc' }, t.title),
    h('label', {}, 'Исполнители (можно несколько)'),
    listBox,
    h('label', {}, 'Срок'), due,
    h('button', { class: 'btn btn-primary', onclick: async (e) => {
      if (!selected.size) return toast('Выберите хотя бы одного', true);
      e.target.disabled = true;
      let ok = 0, fail = 0;
      for (const assigneeId of selected) {
        const body = { templateId: t.id, assigneeId };
        if (due.value) body.dueAt = new Date(due.value).toISOString();
        try { await api('POST', '/checklists/runs', body); ok++; }
        catch { fail++; }
      }
      if (ok) toast(`Назначено: ${ok}` + (fail ? `, ошибок: ${fail}` : ''));
      else toast('Не удалось назначить', true);
      if (ok) go('tpl'); else e.target.disabled = false;
    } }, 'Назначить')
  );
}

  const typeNames = {
    CHECK: 'Да / нет',

  };

function genPassword(len = 12) {
  const sets = ['ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789', '!@#$%*?'];
  const all = sets.join(''), rnd = (n) => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
  const out = sets.map(x => x[rnd(x.length)]);
  while (out.length < len) out.push(all[rnd(all.length)]);
  for (let i = out.length - 1; i > 0; i--) { const j = rnd(i + 1); [out[i], out[j]] = [out[j], out[i]]; }
  return out.join('');
}

async function renderSearch() {
  const sticky = h('div', { class: 'search-sticky pulse' });
  const inputWrap = h('div', { style: 'position:relative' });
  const input = h('input', {
    type: 'search',
    placeholder: 'Найти задачи, шаблоны, людей…',
    value: state.searchQuery || '',
  });
  const clearBtn = h('button', {
    class: 'topbar-btn', type: 'button',
    style: 'position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;color:var(--text-muted)',
    onclick: () => { state.searchQuery = ''; go(state.searchPrevTab || 'all'); },
  });
  clearBtn.innerHTML = icons.back ? icons.back.replace('M15 18l-6-6 6-6', 'M18 6L6 18M6 6l12 12') : '×';
  // X icon
  clearBtn.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg>`;
  inputWrap.append(input, clearBtn);
  sticky.append(inputWrap);
  const resultsBox = h('div', { id: 'search-results' });
  setView(sticky, resultsBox);
  input.focus();
  setTimeout(() => sticky.classList.remove('pulse'), 700);

  const setResults = (...nodes) => {
    resultsBox.replaceChildren(...nodes.flat(Infinity).filter(n => n && n.nodeType));
  };
  const runSearch = async () => {
    state.searchQuery = input.value;
    const query = input.value.trim().toLowerCase();
    if (!query) { setResults(emptyState('Поиск', 'Введите запрос')); return; }
    setResults(h('div', { class: 'skeleton', style: 'height:64px' }));
    const results = [];
    try {
      const runs = arr(await api('GET', `/checklists/runs?workspaceId=${state.wsId}&scope=all`));
      runs.filter(r => ((r.title || r.template?.title || r.templateTitle || '') + personName(r.assignee)).toLowerCase().includes(query))
        .forEach(r => results.push({ type: 'run', data: r }));
    } catch {}
    try {
      let templates = [];
      try { templates = arr(await api('GET', `/checklists/templates?workspaceId=${state.wsId}`)); }
      catch (e) { if (e.status === 400) templates = arr(await api('GET', '/checklists/templates')); }
      templates.filter(t => ((t.title || '') + ' ' + (t.description || '')).toLowerCase().includes(query))
        .forEach(t => results.push({ type: 'tpl', data: t }));
    } catch {}
    if (can('users.read')) {
      try {
        const users = arr(await api('GET', `/users?workspaceId=${state.wsId}`));
        users.filter(u => (personName(u) + ' ' + (u.nickname || '')).toLowerCase().includes(query))
          .forEach(u => results.push({ type: 'user', data: u }));
      } catch {}
    }
    if (!results.length) { setResults(emptyState('Ничего не найдено')); return; }
    const nodes = [];
    const runs = results.filter(r => r.type === 'run');
    const tpls = results.filter(r => r.type === 'tpl');
    const users = results.filter(r => r.type === 'user');
    if (runs.length) {
      nodes.push(h('div', { class: 'section-label' }, 'Задачи'));
      runs.forEach(({ data: r }) => nodes.push(runCard(r, true)));
    }
    if (tpls.length) {
      nodes.push(h('div', { class: 'section-label' }, 'Шаблоны'));
      tpls.forEach(({ data: t }) => {
        const cnt = t.items?.length ?? t._count?.items;
        nodes.push(h('div', { class: 'card click', onclick: () => show(() => showAssign(t)) },
          h('strong', {}, t.title),
          t.description && h('div', { class: 'muted' }, t.description),
          cnt != null && h('div', { class: 'small', style: 'margin-top:6px' }, pluralPunkty(cnt))
        ));
      });
    }
    if (users.length) {
      nodes.push(h('div', { class: 'section-label' }, 'Команда'));
      users.forEach(({ data: u }) => {
        nodes.push(h('div', { class: 'card' },
          h('div', { class: 'row' },
            h('div', { style: 'display:flex;gap:12px;align-items:center' },
              h('div', { class: 'avatar-lg', style: 'width:40px;height:40px;font-size:14px' }, initials(u)),
              h('div', {},
                h('strong', {}, personName(u)),
                h('div', { class: 'muted' }, atNick(u))
              )
            )
          )
        ));
      });
    }
    setResults(...nodes);
  };
  let debounce;
  input.addEventListener('input', () => {
    clearTimeout(debounce);
    sticky.classList.add('pulse');
    setTimeout(() => sticky.classList.remove('pulse'), 500);
    debounce = setTimeout(runSearch, 280);
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { state.searchQuery = ''; go(state.searchPrevTab || 'all'); }
  });
  await runSearch();
}

/* --- Export PDF / JPEG --- */
async function exportViewAs(format) {
  const node = $('view');
  if (!node) return toast('Нечего сохранять', true);
  toast('Готовлю файл…');
  try {
    // dynamic import html2canvas-like via foreignObject svg snapshot
    const rect = node.getBoundingClientRect();
    const w = Math.ceil(node.scrollWidth);
    const h = Math.ceil(node.scrollHeight);
    const clone = node.cloneNode(true);
    clone.style.width = w + 'px';
    clone.style.paddingBottom = '24px';
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;left:-9999px;top:0;background:var(--bg);padding:16px;';
    wrap.appendChild(clone);
    document.body.appendChild(wrap);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w+32}" height="${h+32}">
      <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml">${new XMLSerializer().serializeToString(clone)}</div>
      </foreignObject></svg>`;
    // Fallback: print dialog for PDF, canvas text for simple export
    if (format === 'pdf') {
      const win = window.open('', '_blank');
      if (!win) { toast('Разрешите всплывающие окна', true); wrap.remove(); return; }
      win.document.write(`<!DOCTYPE html><html><head><title>Чеклист</title>
        <style>body{font-family:system-ui;padding:24px;color:#1a1a1a} h1{font-size:22px}</style>
        </head><body>${node.innerHTML}</body></html>`);
      win.document.close();
      setTimeout(() => { win.print(); wrap.remove(); toast('Откройте «Сохранить как PDF» в печати'); }, 400);
      return;
    }
    // JPEG via canvas of text content summary
    const canvas = document.createElement('canvas');
    canvas.width = 800; canvas.height = Math.min(1200, 200 + node.innerText.length * 0.4);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FBF7F0';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#2C2419';
    ctx.font = '16px system-ui';
    const lines = node.innerText.split('\n').filter(Boolean);
    let y = 40;
    ctx.font = 'bold 22px system-ui';
    ctx.fillText(document.title || 'Чеклисты', 32, y);
    y += 36;
    ctx.font = '15px system-ui';
    for (const line of lines.slice(0, 40)) {
      ctx.fillText(line.slice(0, 70), 32, y);
      y += 22;
      if (y > canvas.height - 40) break;
    }
    canvas.toBlob((blob) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'checklist-' + new Date().toISOString().slice(0,10) + '.jpg';
      a.click();
      URL.revokeObjectURL(a.href);
      toast('JPEG сохранён');
    }, 'image/jpeg', 0.92);
    wrap.remove();
  } catch (err) {
    toast(err.message || 'Ошибка экспорта', true);
  }
}
