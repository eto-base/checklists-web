<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чеклисты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #EEF1F5; --surface: #FFFFFF; --surface-2: #F4F6F8;
    --text: #0B141A; --text-secondary: #4A5568; --text-muted: #718096;
    --border: #D8DEE6; --border-strong: #C5CED8;
    --accent: #2AABEE; --accent-hover: #1E9AD8; --accent-soft: rgba(42, 171, 238, 0.14);
    --success: #34C759; --success-soft: rgba(52, 199, 89, 0.14);
    --danger: #FF3B30; --danger-soft: rgba(255, 59, 48, 0.12);
    --shadow: 0 1px 2px rgba(0,0,0,.05); --shadow-lg: 0 12px 36px rgba(0,0,0,.12);
    --r-sm: 10px; --r-lg: 16px; --r-pill: 999px;
    --header-height: 52px; --safe-bottom: env(safe-area-inset-bottom, 0px);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #0A0C10; --surface: #14181F; --surface-2: #1C222C;
    --text: #F2F5F8; --text-secondary: #A8B3C2; --text-muted: #7A8698;
    --border: #2A3140; --border-strong: #3A4354;
    --accent: #3BB4F0; --accent-hover: #5CC4F5; --accent-soft: rgba(59, 180, 240, 0.2);
    --shadow: 0 1px 2px rgba(0,0,0,.35); --shadow-lg: 0 12px 36px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.4; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  #app { min-height: 100%; }
  .hidden { display: none !important; }
  
  /* Экран входа */
  #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: var(--bg); }
  .login-card { width: 100%; max-width: 380px; background: var(--surface); border-radius: 20px; padding: 28px 22px; box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
  .login-logo { width: 52px; height: 52px; border-radius: 14px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; font-size: 24px; font-weight: 700; }
  .login-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .login-card .subtitle { color: var(--text-secondary); font-size: 15px; margin-bottom: 22px; }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin: 14px 0 6px; }
  input, button { font-family: inherit; font-size: 16px; }
  input { width: 100%; padding: 12px 14px; border-radius: var(--r-sm); border: 1.5px solid var(--border-strong); background: var(--surface); color: var(--text); }
  input:focus { outline: none; border-color: var(--accent); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 18px; border-radius: var(--r-sm); border: none; font-weight: 600; font-size: 16px; cursor: pointer; width: 100%; margin-top: 14px; min-height: 48px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--surface-2); color: var(--text); }
  .alert { padding: 12px; border-radius: var(--r-sm); font-size: 14px; margin-top: 12px; }
  .alert-error { background: var(--danger-soft); color: var(--danger); }
  
  /* Оболочка приложения */
  #app-screen { display: flex; flex-direction: column; min-height: 100vh; padding-bottom: calc(80px + var(--safe-bottom)); }
  .topbar { position: sticky; top: 0; z-index: 40; height: var(--header-height); background: var(--surface); border-bottom: 0.5px solid var(--border); display: flex; align-items: center; padding: 0 8px; }
  .topbar-btn { width: 44px; height: 44px; border: none; background: transparent; border-radius: 12px; color: var(--accent); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .topbar-title { flex: 1; font-size: 17px; font-weight: 600; padding-left: 4px; }
  
  #view { flex: 1; padding: 16px; max-width: 600px; margin: 0 auto; width: 100%; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .page-desc { color: var(--text-secondary); font-size: 14px; margin-bottom: 16px; }
  
  /* Списки */
  .list-group { background: var(--surface); border-radius: var(--r-lg); overflow: hidden; border: 0.5px solid var(--border); }
  .list-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 0.5px solid var(--border); cursor: pointer; }
  .list-row:last-child { border-bottom: none; }
  .list-row:active { background: var(--surface-2); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; flex-shrink: 0; }
  .info { flex: 1; min-width: 0; }
  .info-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info-sub { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  
  /* Бейджи */
  .badge { padding: 4px 8px; border-radius: var(--r-pill); font-size: 12px; font-weight: 600; }
  .badge.ok { background: var(--success-soft); color: var(--success); }
  .badge.pending { background: var(--accent-soft); color: var(--accent); }
  .badge.danger { background: var(--danger-soft); color: var(--danger); }
  
  /* Нижнее меню */
  .dock { position: fixed; left: 0; right: 0; bottom: calc(14px + var(--safe-bottom)); z-index: 30; display: flex; justify-content: center; pointer-events: none; }
  .bottom-nav { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 28px; padding: 4px; box-shadow: 0 8px 28px rgba(0,0,0,.1); pointer-events: auto; }
  .bottom-nav button { width: 56px; height: 48px; border: none; background: transparent; border-radius: 24px; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .bottom-nav button.active { color: var(--accent); background: var(--accent-soft); }
  .bottom-nav button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; }
  
  .empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 15px; }
</style>
</head>
<body>
<div id="app">
  <!-- ЭКРАН ВХОДА -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">✓</div>
      <h1>Чеклисты</h1>
      <p class="subtitle">Войдите в аккаунт</p>
      <label for="login-email">Email</label>
      <input type="email" id="login-email" placeholder="you@example.com" autocomplete="username">
      <label for="login-password">Пароль</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
      <button class="btn btn-primary" id="login-btn">Войти</button>
      <div id="login-error" class="alert alert-error hidden"></div>
    </div>
  </div>

  <!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
  <div id="app-screen" class="hidden">
    <header class="topbar">
      <button class="topbar-btn hidden" id="back-btn"></button>
      <div class="topbar-title" id="topbar-title">Чеклисты</div>
    </header>
    
    <main id="view"></main>
    
    <div class="dock">
      <nav class="bottom-nav" id="bottom-nav"></nav>
    </div>
  </div>
</div>

<script type="module">
  // --- НАСТРОЙКИ ---
  const NGROK_URL = 'https://dullness-playpen-starlet.ngrok-free.dev'; // ВАШ АДРЕС NGROK
  const API_BASE = location.hostname.endsWith('github.io') ? NGROK_URL : '';
  
  // Инициализация Telegram
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  // --- СОСТОЯНИЕ ---
  const state = {
    me: null,
    token: localStorage.getItem('token') || null,
    csrf: null,
    wsId: localStorage.getItem('wsId') || null,
    currentTab: 'checklists',
  };

  const $ = (id) => document.getElementById(id);

  // --- API ОБЕРТКА ---
  async function api(method, path, body) {
    const headers = { 'ngrok-skip-browser-warning': '1' };
    if (state.token) headers['Authorization'] = `Bearer ${state.token}`;
    if (state.csrf) headers['x-csrf-token'] = state.csrf;
    if (body) headers['content-type'] = 'application/json';

    const res = await fetch(API_BASE + path, {
      method, headers, body: body ? JSON.stringify(body) : undefined
    });
    
    const text = await res.text();
    let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
    
    if (!res.ok) {
      if (res.status === 401) { logout(); throw new Error('Сессия истекла'); }
      throw new Error(data?.message || res.statusText || 'Ошибка');
    }
    return data;
  }

  // --- АВТОРИЗАЦИЯ ---
  $('login-btn').onclick = async () => {
    const email = $('login-email').value.trim();
    const password = $('login-password').value;
    if (!email || !password) return showError('Заполните все поля');
    
    $('login-btn').disabled = true;
    try {
      const data = await api('POST', '/auth/login', { email, password });
      if (data.twoFactorRequired) return showError('2FA пока не поддерживается');
      
      state.token = data.sessionToken;
      state.csrf = data.csrfToken;
      localStorage.setItem('token', state.token);
      
      await initApp();
    } catch (e) {
      showError(e.message);
    } finally {
      $('login-btn').disabled = false;
    }
  };

  function showError(msg) {
    const el = $('login-error');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  function logout() {
    state.token = null; state.csrf = null; state.me = null;
    localStorage.removeItem('token');
    $('login-screen').classList.remove('hidden');
    $('app-screen').classList.add('hidden');
  }

  async function initApp() {
    try {
      state.me = await api('GET', '/auth/me');
      state.csrf = state.me.csrfToken;
      
      const workspaces = await api('GET', '/workspaces');
      if (!state.wsId && workspaces.length > 0) {
        state.wsId = workspaces[0].id;
        localStorage.setItem('wsId', state.wsId);
      }

      $('login-screen').classList.add('hidden');
      $('app-screen').classList.remove('hidden');
      
      renderBottomNav();
      navigate('checklists');
    } catch (e) {
      logout();
    }
  }

  // --- НАВИГАЦИЯ ---
  const icons = {
    checklists: '<svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>',
    templates: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>',
    people: '<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>',
    settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>',
    back: '<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>'
  };

  function renderBottomNav() {
    const nav = $('bottom-nav');
    nav.innerHTML = '';
    
    const tabs = [
      { id: 'checklists', title: 'Чеклисты', icon: icons.checklists },
      { id: 'templates', title: 'Шаблоны', icon: icons.templates },
      { id: 'people', title: 'Команда', icon: icons.people },
      { id: 'settings', title: 'Кабинет', icon: icons.settings },
    ];

    tabs.forEach(tab => {
      const btn = document.createElement('button');
      btn.className = state.currentTab === tab.id ? 'active' : '';
      btn.innerHTML = tab.icon;
      btn.title = tab.title;
      btn.onclick = () => navigate(tab.id);
      nav.appendChild(btn);
    });
  }

  function navigate(tab) {
    state.currentTab = tab;
    $('back-btn').classList.toggle('hidden', tab === 'checklists');
    $('back-btn').innerHTML = icons.back;
    $('back-btn').onclick = () => navigate('checklists');
    
    const titles = { checklists: 'Чеклисты', templates: 'Шаблоны', people: 'Команда', settings: 'Кабинет' };
    $('topbar-title').textContent = titles[tab] || 'Чеклисты';
    
    renderBottomNav();
    
    if (tab === 'checklists') renderChecklists();
    if (tab === 'templates') renderTemplates();
    if (tab === 'people') renderPeople();
    if (tab === 'settings') renderSettings();
  }

  // --- ЭКРАНЫ ---
  async function renderChecklists() {
    $('view').innerHTML = '<div class="empty">Загрузка...</div>';
    try {
      const runs = await api('GET', `/checklists/runs?workspaceId=${state.wsId}&scope=all`);
      if (!runs.length) return $('view').innerHTML = '<div class="empty">Чеклистов пока нет</div>';
      
      const html = runs.map(run => `
        <div class="list-row" onclick="alert('Открытие чеклиста в разработке')">
          <div class="info">
            <div class="info-title">${run.template?.title || 'Чеклист'}</div>
            <div class="info-sub">${new Date(run.createdAt).toLocaleDateString()}</div>
          </div>
          <span class="badge ${run.status === 'COMPLETED' ? 'ok' : 'pending'}">${run.status}</span>
        </div>
      `).join('');
      
      $('view').innerHTML = `<h1>Чеклисты</h1><p class="page-desc">Все назначенные чеклисты</p><div class="list-group">${html}</div>`;
    } catch (e) {
      $('view').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
    }
  }

  async function renderTemplates() {
    $('view').innerHTML = '<div class="empty">Загрузка...</div>';
    try {
      const templates = await api('GET', `/checklists/templates?workspaceId=${state.wsId}`);
      if (!templates.length) return $('view').innerHTML = '<div class="empty">Шаблонов пока нет</div>';
      
      const html = templates.map(t => `
        <div class="list-row">
          <div class="info">
            <div class="info-title">${t.title}</div>
            <div class="info-sub">${t.items?.length || 0} пунктов</div>
          </div>
        </div>
      `).join('');
      
      $('view').innerHTML = `<h1>Шаблоны</h1><p class="page-desc">Шаблоны для чеклистов</p><div class="list-group">${html}</div>`;
    } catch (e) {
      $('view').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
    }
  }

  async function renderPeople() {
    $('view').innerHTML = '<div class="empty">Загрузка...</div>';
    try {
      const users = await api('GET', `/users?workspaceId=${state.wsId}`);
      if (!users.length) return $('view').innerHTML = '<div class="empty">Сотрудников пока нет</div>';
      
      const html = users.map(u => `
        <div class="list-row" onclick="alert('Назначение задачи для ${u.email} в разработке')">
          <div class="avatar">${(u.firstName?.[0] || '') + (u.lastName?.[0] || '')}</div>
          <div class="info">
            <div class="info-title">${u.firstName || ''} ${u.lastName || ''}</div>
            <div class="info-sub">${u.email}</div>
          </div>
        </div>
      `).join('');
      
      $('view').innerHTML = `<h1>Команда</h1><p class="page-desc">Список сотрудников</p><div class="list-group">${html}</div>`;
    } catch (e) {
      $('view').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
    }
  }

  function renderSettings() {
    $('view').innerHTML = `
      <h1>Кабинет</h1>
      <p class="page-desc">${state.me?.email}</p>
      <button class="btn btn-secondary" onclick="logout()" style="color:var(--danger)">Выйти из аккаунта</button>
    `;
  }

  // --- СТАРТ ---
  if (state.token) {
    initApp();
  } else {
    $('login-screen').classList.remove('hidden');
  }
</script>
</body>
</html>
