<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чеклисты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --accent: #2AABEE;
    --accent-2: #5b9fff;
    --accent-soft: rgba(42,171,238,.14);
    --accent-glow: rgba(42,171,238,.35);
    --bg: #eef1f5;
    --bg-card: #ffffff;
    --bg-input: #ffffff;
    --text: #0b141a;
    --text-secondary: #4a5568;
    --text-muted: #718096;
    --border: #d8dee6;
    --border-strong: #c5ced8;
    --danger: #ff3b30;
    --danger-soft: #fdecea;
    --success: #34c759;
    --success-soft: #e6f7e9;
    --warning: #ff9f0a;
    --warning-soft: #fff7e6;
    --shadow: 0 1px 2px rgba(0,0,0,.05);
    --shadow-md: 0 4px 16px rgba(0,0,0,.08);
    --shadow-lg: 0 12px 40px rgba(0,0,0,.12);
    --radius: 16px;
    --radius-sm: 12px;
    --nav-height: 56px;
    --header-height: 52px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    --ease: cubic-bezier(.25,.1,.25,1);
    --glass: rgba(255,255,255,.72);
    --glass-border: rgba(255,255,255,.55);
    --menu-item: rgba(255,255,255,.55);
    --menu-item-active: rgba(42,171,238,.22);
    --overlay-bg: rgba(15,20,30,.35);
  }
  [data-theme="dark"] {
    --bg: #0a0c10;
    --bg-card: #14181f;
    --bg-input: #1c222c;
    --text: #f2f5f8;
    --text-secondary: #a8b3c2;
    --text-muted: #7a8698;
    --border: #2a3140;
    --border-strong: #3a4354;
    --danger: #ff453a;
    --danger-soft: #3a1518;
    --success: #30d158;
    --success-soft: #0f2a1a;
    --warning: #ffd60a;
    --warning-soft: #2e2808;
    --shadow: 0 1px 2px rgba(0,0,0,.35);
    --shadow-md: 0 4px 16px rgba(0,0,0,.4);
    --shadow-lg: 0 12px 40px rgba(0,0,0,.5);
    --glass: rgba(22,28,38,.78);
    --glass-border: rgba(255,255,255,.08);
    --menu-item: rgba(255,255,255,.06);
    --menu-item-active: rgba(42,171,238,.28);
    --overlay-bg: rgba(0,0,0,.55);
  }
  [data-accent="blue"] { --accent:#2AABEE; --accent-2:#5b9fff; --accent-soft:rgba(42,171,238,.14); --accent-glow:rgba(42,171,238,.35); }
  [data-accent="violet"] { --accent:#8b5cf6; --accent-2:#a78bfa; --accent-soft:rgba(139,92,246,.16); --accent-glow:rgba(139,92,246,.35); }
  [data-accent="teal"] { --accent:#14b8a6; --accent-2:#2dd4bf; --accent-soft:rgba(20,184,166,.16); --accent-glow:rgba(20,184,166,.35); }
  [data-accent="orange"] { --accent:#f97316; --accent-2:#fb923c; --accent-soft:rgba(249,115,22,.16); --accent-glow:rgba(249,115,22,.35); }
  [data-accent="pink"] { --accent:#ec4899; --accent-2:#f472b6; --accent-soft:rgba(236,72,153,.16); --accent-glow:rgba(236,72,153,.35); }
  [data-accent="green"] { --accent:#22c55e; --accent-2:#4ade80; --accent-soft:rgba(34,197,94,.16); --accent-glow:rgba(34,197,94,.35); }
  [data-contrast="high"] { --text-secondary: var(--text); }
  [data-theme="light"][data-contrast="high"] { --text:#000; --text-secondary:#1a1a1a; --text-muted:#333; --border-strong:#999; }
  [data-theme="dark"][data-contrast="high"] { --text:#fff; --text-secondary:#eee; --text-muted:#ccc; --border-strong:#666; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.4; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  #app { min-height: 100%; }

  #login-screen, #tfa-screen, #forgot-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    background: radial-gradient(ellipse at 20% 0%, var(--accent-soft), transparent 50%), radial-gradient(ellipse at 80% 100%, var(--accent-soft), transparent 45%), var(--bg);
  }
  .login-card {
    width: 100%; max-width: 380px; background: var(--glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border); border-radius: 24px; padding: 32px 24px 28px; box-shadow: var(--shadow-lg);
  }
  .login-logo {
    width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(145deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center; margin-bottom: 18px; color: #fff; font-size: 26px; font-weight: 700;
    box-shadow: 0 6px 20px var(--accent-glow);
  }
  .login-card h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 6px; }
  .login-card .subtitle { color: var(--text-secondary); font-size: 15px; margin-bottom: 24px; }

  #app-screen { display: flex; flex-direction: column; min-height: 100vh; }
  .topbar {
    position: sticky; top: 0; z-index: 40; height: var(--header-height); background: var(--bg-card);
    border-bottom: 0.5px solid var(--border); display: flex; align-items: center; padding: 0 6px 0 4px; gap: 2px;
  }
  .topbar-btn {
    width: 42px; height: 42px; border: none; background: transparent; border-radius: 12px; color: var(--accent);
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  .topbar-btn:active { background: var(--accent-soft); }
  .topbar-btn svg { width: 24px; height: 24px; }
  .topbar-btn.muted { color: var(--text-secondary); }
  .topbar-title { flex: 1; font-size: 17px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }
  .topbar-actions { display: flex; align-items: center; }
  .ws-select {
    max-width: 120px; padding: 6px 8px; font-size: 13px; font-weight: 500; border-radius: 8px;
    border: 1.5px solid var(--border-strong); background: var(--bg-input); color: var(--text); font-family: inherit; margin-right: 4px;
  }

  .overlay {
    position: fixed; inset: 0; background: var(--overlay-bg); z-index: 50; opacity: 0; pointer-events: none;
    transition: opacity .25s var(--ease); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .sidemenu {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(320px, 88vw); z-index: 60;
    transform: translateX(-105%); transition: transform .3s var(--ease); display: flex; flex-direction: column;
    background: radial-gradient(ellipse at 10% 0%, var(--accent-soft), transparent 55%), radial-gradient(ellipse at 90% 100%, var(--accent-soft), transparent 50%), var(--glass);
    backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); border-right: 1px solid var(--glass-border);
    box-shadow: var(--shadow-lg); padding: 12px 12px 16px;
  }
  .sidemenu.open { transform: translateX(0); }
  .side-profile {
    display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px;
    background: var(--menu-item); border: 1px solid var(--glass-border); cursor: pointer; margin-bottom: 8px;
  }
  .side-profile:active { background: var(--menu-item-active); }
  .side-profile .avatar {
    width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(145deg, var(--accent), var(--accent-2));
    color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px;
    flex-shrink: 0; box-shadow: 0 2px 10px var(--accent-glow); position: relative; overflow: hidden;
  }
  .side-profile .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .side-profile .online { position: absolute; right: 1px; bottom: 1px; width: 11px; height: 11px; background: var(--success); border: 2px solid var(--bg-card); border-radius: 50%; }
  .side-profile-text { flex: 1; min-width: 0; }
  .side-profile-name { font-weight: 650; font-size: 16px; letter-spacing: -.01em; }
  .side-profile-sub { font-size: 13px; color: var(--text-secondary); margin-top: 1px; }
  .side-profile-mail { font-size: 12px; color: var(--text-muted); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-close {
    position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; border: none;
    background: var(--menu-item); color: var(--text-secondary); display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .sidemenu-nav { flex: 1; overflow-y: auto; padding: 6px 0; }
  .sidemenu-section { font-size: 12px; font-weight: 600; color: var(--text-muted); padding: 14px 10px 8px; letter-spacing: .02em; }
  .sidemenu-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 4px; border-radius: 14px; border: none;
    background: var(--menu-item); color: var(--text); font-size: 15px; font-weight: 500; width: 100%; text-align: left;
    cursor: pointer; font-family: inherit;
  }
  .sidemenu-item.active { background: linear-gradient(90deg, var(--accent-soft), var(--menu-item-active)); color: var(--accent); box-shadow: 0 0 0 1px var(--accent-glow); }
  .sidemenu-item svg { width: 20px; height: 20px; flex-shrink: 0; opacity: .9; }
  .sidemenu-item .chev { margin-left: auto; opacity: .35; font-size: 16px; }
  .sidemenu-item .soon { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 8px; }
  .sidemenu-footer { padding-top: 8px; }
  .sidemenu-item.logout { color: var(--danger); background: var(--danger-soft); }

  #view { flex: 1; padding: 12px 12px calc(var(--nav-height) + var(--safe-bottom) + 16px); max-width: 560px; margin: 0 auto; width: 100%; }
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--nav-height) + var(--safe-bottom));
    padding-bottom: var(--safe-bottom); background: var(--bg-card); border-top: 0.5px solid var(--border); display: flex; z-index: 30;
  }
  .bottom-nav button {
    flex: 1; border: none; background: transparent; color: var(--text-muted); font-size: 10px; font-weight: 500;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; font-family: inherit; padding: 6px 2px 4px;
  }
  .bottom-nav button.active { color: var(--accent); }
  .bottom-nav button svg { width: 24px; height: 24px; }

  h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 2px; }
  h2 { font-size: 15px; font-weight: 600; margin: 20px 0 10px; color: var(--text-secondary); }
  .page-desc { color: var(--text-secondary); font-size: 14px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin: 14px 0 6px; }
  input, select, textarea, button { font-family: inherit; font-size: 16px; }
  input[type="text"], input[type="email"], input[type="password"], input[type="number"], input[type="datetime-local"], input[type="search"], input[type="file"], select, textarea {
    width: 100%; padding: 12px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--border-strong); background: var(--bg-input); color: var(--text);
  }
  input::placeholder, textarea::placeholder { color: var(--text-muted); opacity: 1; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input:disabled, select:disabled, textarea:disabled { opacity: .55; cursor: not-allowed; background: var(--bg); }
  textarea { resize: vertical; min-height: 84px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 18px; border-radius: var(--radius-sm);
    border: none; font-weight: 600; font-size: 16px; cursor: pointer; width: 100%; margin-top: 14px; letter-spacing: -.01em;
  }
  .btn:active:not(:disabled) { transform: scale(.98); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn-primary { background: linear-gradient(145deg, var(--accent), var(--accent-2)); color: #fff; box-shadow: 0 4px 14px var(--accent-glow); }
  .btn-secondary { background: var(--bg-card); color: var(--text); border: 1.5px solid var(--border-strong); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-ghost { background: transparent; color: var(--accent); width: auto; padding: 8px 12px; font-size: 15px; font-weight: 500; margin-top: 0; box-shadow: none; }
  .btn-sm { width: auto; padding: 8px 14px; font-size: 14px; margin-top: 0; border-radius: 10px; }

  .card { background: var(--bg-card); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px; box-shadow: var(--shadow); }
  .card.click { cursor: pointer; }
  .card.click:active { transform: scale(.985); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .gap { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .muted { color: var(--text-secondary); font-size: 14px; }
  .small { font-size: 12px; color: var(--text-muted); }
  .badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .badge.bad { background: var(--danger-soft); color: var(--danger); }
  .badge.ok { background: var(--success-soft); color: var(--success); }
  .badge.neutral { background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border); }
  .alert { padding: 12px 14px; border-radius: var(--radius-sm); font-size: 14px; margin-bottom: 12px; line-height: 1.4; }
  .alert-info { background: var(--warning-soft); color: #8a5a00; }
  [data-theme="dark"] .alert-info { color: #f5d76e; }
  .alert-error { background: var(--danger-soft); color: var(--danger); }
  .alert-success { background: var(--success-soft); color: var(--success); word-break: break-all; }
  .empty { text-align: center; padding: 48px 24px; color: var(--text-muted); }
  .empty-icon { width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 20px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; color: var(--accent); }
  .empty-icon svg { width: 32px; height: 32px; }
  .empty-title { font-size: 16px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
  .empty-desc { font-size: 14px; max-width: 240px; margin: 0 auto; }
  .choices { display: flex; gap: 10px; }
  .choice { flex: 1; padding: 13px; border-radius: var(--radius-sm); border: 1.5px solid var(--border-strong); background: var(--bg-card); color: var(--text); font-weight: 600; font-size: 15px; cursor: pointer; font-family: inherit; }
  .choice.on.yes { background: var(--success); color: #fff; border-color: var(--success); }
  .choice.on.no { background: var(--danger); color: #fff; border-color: var(--danger); }
  .choice:disabled { opacity: .5; cursor: default; }
  .flag { color: var(--danger); font-size: 13px; font-weight: 600; margin-top: 8px; }
  .photo { max-width: 100%; border-radius: 12px; margin-top: 10px; }
  .itemrow { border-top: 0.5px solid var(--border); padding-top: 16px; margin-top: 16px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { padding: 7px 14px; border-radius: 20px; border: 1.5px solid var(--border-strong); background: var(--bg-card); color: var(--text-secondary); font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(var(--nav-height) + var(--safe-bottom) + 14px);
    background: #2c2c2e; color: #fff; padding: 14px 18px; border-radius: 12px; z-index: 100; font-size: 15px; font-weight: 500;
    box-shadow: var(--shadow-lg); transform: translateY(24px); opacity: 0; transition: transform .28s, opacity .28s; pointer-events: none; text-align: center;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.bad { background: var(--danger); }
  .stub-icon { width: 68px; height: 68px; margin: 0 auto 18px; background: var(--accent-soft); border-radius: 18px; display: flex; align-items: center; justify-content: center; color: var(--accent); }
  .stub-icon svg { width: 30px; height: 30px; }
  .hidden { display: none !important; }
  .back-btn { margin-bottom: 8px; }
  .divider { height: 0.5px; background: var(--border); margin: 20px 0; }
  .section-label { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; padding: 8px 4px 6px; }
  .skeleton { background: linear-gradient(90deg, var(--border) 25%, var(--bg) 50%, var(--border) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 10px; height: 16px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .list-group { background: var(--bg-card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .list-row { position: relative; overflow: hidden; border-bottom: 0.5px solid var(--border); }
  .list-row:last-child { border-bottom: none; }
  .list-row-inner { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--bg-card); position: relative; z-index: 1; transition: transform .2s var(--ease); touch-action: pan-y; }
  .list-row-actions { position: absolute; right: 0; top: 0; bottom: 0; display: flex; z-index: 0; }
  .list-row-actions button { border: none; color: #fff; font-weight: 600; font-size: 14px; padding: 0 20px; cursor: pointer; font-family: inherit; min-width: 88px; }
  .list-row-actions .act-delete { background: #ff3b30; }
  .list-row.open .list-row-inner { transform: translateX(-88px); }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .swatch { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; box-shadow: var(--shadow-md); }
  .swatch.on { border-color: var(--text); }
  .emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 10px; }
  .emoji-grid button { aspect-ratio: 1; border: 1.5px solid var(--border); border-radius: 12px; background: var(--bg-card); font-size: 22px; cursor: pointer; }
  .emoji-grid button.on { border-color: var(--accent); background: var(--accent-soft); }
  .avatar-lg {
    width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(145deg, var(--accent), var(--accent-2));
    color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 28px; overflow: hidden; flex-shrink: 0;
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .avatar-lg img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
<div id="app">
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">✓</div>
      <h1>Чеклисты</h1>
      <p class="subtitle">Войдите в аккаунт</p>
      <label for="login-id">Email или никнейм</label>
      <input type="text" id="login-id" placeholder="you@example.com или nickname" autocomplete="username">
      <label for="password">Пароль</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      <button class="btn btn-primary" id="login-btn">Войти</button>
      <button class="btn btn-ghost" id="forgot-btn" style="width:100%;margin-top:12px;justify-content:center">Забыли пароль?</button>
      <div id="login-error" class="alert alert-error hidden" style="margin-top:16px"></div>
    </div>
  </div>
  <div id="tfa-screen" class="hidden">
    <div class="login-card">
      <div class="login-logo">🔐</div>
      <h1>Подтверждение</h1>
      <p class="subtitle">Код из приложения-аутентификатора</p>
      <label for="tfa-code">Код</label>
      <input type="text" id="tfa-code" placeholder="000000" inputmode="numeric" autocomplete="one-time-code" maxlength="8">
      <button class="btn btn-primary" id="tfa-btn">Подтвердить</button>
      <button class="btn btn-ghost" id="tfa-back" style="width:100%;margin-top:12px;justify-content:center">← Назад</button>
      <div id="tfa-error" class="alert alert-error hidden" style="margin-top:16px"></div>
    </div>
  </div>
  <div id="forgot-screen" class="hidden">
    <div class="login-card">
      <div class="login-logo">✉</div>
      <h1>Восстановление</h1>
      <p class="subtitle">Укажите email</p>
      <label for="forgot-email">Email</label>
      <input type="email" id="forgot-email" placeholder="you@example.com">
      <button class="btn btn-primary" id="forgot-submit">Отправить</button>
      <button class="btn btn-ghost" id="forgot-back" style="width:100%;margin-top:12px;justify-content:center">← Назад</button>
      <div id="forgot-msg" class="hidden" style="margin-top:16px"></div>
    </div>
  </div>
  <div id="app-screen" class="hidden">
    <header class="topbar">
      <button class="topbar-btn" id="menu-btn" aria-label="Меню">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="topbar-title" id="topbar-title">Чеклисты</div>
      <div class="topbar-actions">

    h('div', { class: 'card' }, h('strong', {}, 'О приложении'), h('div', { class: 'muted', style: 'margin-top:8px' }, 'Чеклисты · Telegram Web App'), h('div', { class: 'small', style: 'margin-top:4px' }, 'UI 3.0 · glass + themes'))
  );
}
async function renderSearch() {
  const inputWrap = h('div', { style: 'position:relative;margin-bottom:14px' });
  const input = h('input', { type: 'search', placeholder: 'Чеклисты, шаблоны, люди…', value: state.searchQuery || '', style: 'padding-right:44px' });
  const clearBtn = h('button', { class: 'topbar-btn', type: 'button', style: 'position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;color:var(--text-muted)', onclick: () => { state.searchQuery = ''; go(state.searchPrevTab || 'mine'); } });
  clearBtn.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg>`;
  inputWrap.append(input, clearBtn);
  const runSearch = async () => {
    state.searchQuery = input.value; const query = input.value.trim().toLowerCase();
    if (!query) { setView(inputWrap, emptyState('Поиск', 'Введите запрос')); input.focus(); return; }
    setView(inputWrap, h('div', { class: 'skeleton', style: 'height:64px' }));
    const results = [];
    try {
      const runs = arr(await api('GET', `/checklists/runs?workspaceId=${state.wsId}&scope=all`));
      runs.filter(r => ((r.title || r.template?.title || r.templateTitle || '') + personName(r.assignee)).toLowerCase().includes(query)).forEach(r => results.push({ type: 'run', data: r }));
    } catch {}
    try {
      let templates = [];
      try { templates = arr(await api('GET', `/checklists/templates?workspaceId=${state.wsId}`)); } catch (e) { if (e.status === 400) templates = arr(await api('GET', '/checklists/templates')); }
      templates.filter(t => ((t.title || '') + ' ' + (t.description || '')).toLowerCase().includes(query)).forEach(t => results.push({ type: 'tpl', data: t }));
    } catch {}
    if (can('users.read')) {
      try {
        const users = arr(await api('GET', '/users'));
        users.filter(u => (personName(u) + ' ' + (u.email || '')).toLowerCase().includes(query)).forEach(u => results.push({ type: 'user', data: u }));
      } catch {}
    }
    const nodes = [inputWrap];
    if (!results.length) nodes.push(emptyState('Ничего не найдено'));
    else {
      const runs = results.filter(r => r.type === 'run');
      const tpls = results.filter(r => r.type === 'tpl');
      const users = results.filter(r => r.type === 'user');
      if (runs.length) { nodes.push(h('div', { class: 'section-label' }, 'Чеклисты')); runs.forEach(({ data: r }) => nodes.push(runCard(r, true))); }
      if (tpls.length) { nodes.push(h('div', { class: 'section-label' }, 'Шаблоны')); tpls.forEach(({ data: t }) => nodes.push(h('div', { class: 'card click', onclick: () => show(() => showAssign(t)) }, h('strong', {}, t.title), t.description && h('div', { class: 'muted' }, t.description)))); }
      if (users.length) { nodes.push(h('div', { class: 'section-label' }, 'Сотрудники')); users.forEach(({ data: u }) => nodes.push(h('div', { class: 'card' }, h('div', { class: 'row' }, h('div', { style: 'display:flex;gap:12px;align-items:center' }, h('div', { class: 'avatar-lg', style: 'width:40px;height:40px;font-size:14px' }, initials(u)), h('div', {}, h('strong', {}, personName(u)), h('div', { class: 'muted' }, u.email || ''))))))); }
    }
    setView(nodes); input.focus();
    try { const len = input.value.length; input.setSelectionRange(len, len); } catch {}
  };
  let debounce;
  input.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(runSearch, 280); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Escape') { state.searchQuery = ''; go(state.searchPrevTab || 'mine'); } });
  setView(inputWrap); await runSearch(); input.focus();
}

}
