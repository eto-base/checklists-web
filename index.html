<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чеклисты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #EEF1F5;
    --surface: #FFFFFF;
    --surface-2: #F4F6F8;
    --text: #0B141A;
    --text-secondary: #4A5568;
    --text-muted: #718096;
    --border: #D8DEE6;
    --border-strong: #C5CED8;
    --accent: #2AABEE;
    --accent-hover: #1E9AD8;
    --accent-soft: rgba(42, 171, 238, 0.14);
    --accent-glow: rgba(42, 171, 238, 0.28);
    --success: #34C759;
    --success-soft: rgba(52, 199, 89, 0.14);
    --danger: #FF3B30;
    --danger-soft: rgba(255, 59, 48, 0.12);
    --warning: #FF9F0A;
    --warning-soft: rgba(255, 159, 10, 0.14);
    --shadow: 0 1px 2px rgba(0,0,0,.05);
    --shadow-md: 0 4px 14px rgba(0,0,0,.07);
    --shadow-lg: 0 12px 36px rgba(0,0,0,.12);
    --r-sm: 10px;
    --r-md: 12px;
    --r-lg: 16px;
    --r-pill: 999px;
    --nav-height: 56px;
    --header-height: 52px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    --ease: cubic-bezier(.25, .1, .25, 1);
    --bg-card: var(--surface);
    --bg-input: var(--surface);
    --primary: var(--accent);
    --primary-soft: var(--accent-soft);
    --glass: var(--surface);
    --glass-border: var(--border);
    --menu-item: transparent;
    --menu-item-active: var(--accent-soft);
    --overlay-bg: rgba(15, 20, 30, 0.4);
  }

  [data-theme="dark"] {
    --bg: #0A0C10;
    --surface: #14181F;
    --surface-2: #1C222C;
    --text: #F2F5F8;
    --text-secondary: #A8B3C2;
    --text-muted: #7A8698;
    --border: #2A3140;
    --border-strong: #3A4354;
    --accent: #3BB4F0;
    --accent-hover: #5CC4F5;
    --accent-soft: rgba(59, 180, 240, 0.2);
    --accent-glow: rgba(59, 180, 240, 0.3);
    --success: #30D158;
    --success-soft: rgba(48, 209, 88, 0.16);
    --danger: #FF453A;
    --danger-soft: rgba(255, 69, 58, 0.16);
    --warning: #FFD60A;
    --warning-soft: rgba(255, 214, 10, 0.14);
    --shadow: 0 1px 2px rgba(0,0,0,.35);
    --shadow-md: 0 4px 14px rgba(0,0,0,.4);
    --shadow-lg: 0 12px 36px rgba(0,0,0,.5);
    --overlay-bg: rgba(0,0,0,.55);
  }

  [data-accent="blue"] { --accent:#2AABEE; --accent-hover:#1E9AD8; --accent-soft:rgba(42,171,238,.14); --accent-glow:rgba(42,171,238,.28); }
  [data-accent="violet"] { --accent:#8B5CF6; --accent-hover:#7C3AED; --accent-soft:rgba(139,92,246,.16); --accent-glow:rgba(139,92,246,.3); }
  [data-accent="teal"] { --accent:#14B8A6; --accent-hover:#0D9488; --accent-soft:rgba(20,184,166,.16); --accent-glow:rgba(20,184,166,.3); }
  [data-accent="orange"] { --accent:#F97316; --accent-hover:#EA580C; --accent-soft:rgba(249,115,22,.16); --accent-glow:rgba(249,115,22,.3); }
  [data-accent="pink"] { --accent:#EC4899; --accent-hover:#DB2777; --accent-soft:rgba(236,72,153,.16); --accent-glow:rgba(236,72,153,.3); }
  [data-accent="green"] { --accent:#22C55E; --accent-hover:#16A34A; --accent-soft:rgba(34,197,94,.16); --accent-glow:rgba(34,197,94,.3); }

  [data-theme="dark"][data-accent="blue"] { --accent:#3BB4F0; --accent-hover:#5CC4F5; }
  [data-contrast="high"] { --text-secondary: var(--text); --text-muted: var(--text-secondary); }
  [data-theme="light"][data-contrast="high"] { --text:#000; --text-secondary:#1A1A1A; --text-muted:#333; --border-strong:#8A949E; }
  [data-theme="dark"][data-contrast="high"] { --text:#FFF; --text-secondary:#EEE; --text-muted:#CCC; --border-strong:#6A7380; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  #app { min-height: 100%; }

  /* Auth */
  #login-screen, #tfa-screen, #forgot-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; background: var(--bg);
  }
  .login-card {
    width: 100%; max-width: 380px; background: var(--surface);
    border-radius: 20px; padding: 28px 22px 24px;
    box-shadow: var(--shadow-lg); border: 1px solid var(--border);
  }
  .login-logo {
    width: 52px; height: 52px; border-radius: 14px;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px; font-size: 24px; font-weight: 700;
  }
  .login-card h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 4px; }
  .login-card .subtitle { color: var(--text-secondary); font-size: 15px; margin-bottom: 22px; }

  /* Shell */
  #app-screen { display: flex; flex-direction: column; min-height: 100vh; }
  .topbar {
    position: sticky; top: 0; z-index: 40; height: var(--header-height);
    background: var(--surface); border-bottom: 0.5px solid var(--border);
    display: flex; align-items: center; padding: 0 4px 0 2px; gap: 2px;
  }
  .topbar-btn {
    width: 44px; height: 44px; border: none; background: transparent; border-radius: 12px;
    color: var(--accent); display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  .topbar-btn:active { background: var(--accent-soft); }
  .topbar-btn svg { width: 22px; height: 22px; }
  .topbar-btn.muted { color: var(--text-secondary); }
  .topbar-title {
    flex: 1; font-size: 17px; font-weight: 600; letter-spacing: -.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 2px;
  }
  .topbar-actions { display: flex; align-items: center; }
  .ws-select {
    max-width: 120px; padding: 6px 8px; font-size: 13px; font-weight: 500;
    border-radius: 8px; border: 1.5px solid var(--border-strong);
    background: var(--surface-2); color: var(--text); font-family: inherit; margin-right: 4px;
  }

  /* Overlay + menu */
  .overlay {
    position: fixed; inset: 0; background: var(--overlay-bg); z-index: 50;
    opacity: 0; pointer-events: none; transition: opacity .22s var(--ease);
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sidemenu {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(300px, 88vw); z-index: 60;
    transform: translateX(-105%); transition: transform .28s var(--ease);
    display: flex; flex-direction: column; background: var(--surface);
    border-right: 0.5px solid var(--border); box-shadow: var(--shadow-lg);
    padding: 8px 10px 12px;
  }
  .sidemenu.open { transform: translateX(0); }
  .side-close {
    position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%;
    border: none; background: var(--surface-2); color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .side-profile {
    display: flex; align-items: center; gap: 12px; padding: 14px 12px; margin: 28px 0 8px;
    border-radius: var(--r-lg); background: var(--surface-2); cursor: pointer;
  }
  .side-profile:active { background: var(--accent-soft); }
  .side-profile .avatar {
    width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px;
    flex-shrink: 0; position: relative; overflow: hidden;
  }
  .side-profile .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .side-profile .online {
    position: absolute; right: 1px; bottom: 1px; width: 11px; height: 11px;
    background: var(--success); border: 2px solid var(--surface); border-radius: 50%;
  }
  .side-profile-text { flex: 1; min-width: 0; }
  .side-profile-name { font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
  .side-profile-sub { font-size: 13px; color: var(--text-secondary); margin-top: 1px; }
  .side-profile-mail {
    font-size: 12px; color: var(--text-muted); margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sidemenu-nav { flex: 1; overflow-y: auto; padding: 4px 0; }
  .sidemenu-section {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    padding: 14px 12px 6px; letter-spacing: .02em;
  }
  .sidemenu-item {
    display: flex; align-items: center; gap: 12px; padding: 12px;
    margin-bottom: 2px; border-radius: var(--r-md); border: none; background: transparent;
    color: var(--text); font-size: 15px; font-weight: 500; width: 100%;
    text-align: left; cursor: pointer; font-family: inherit; min-height: 44px;
  }
  .sidemenu-item:active { background: var(--surface-2); }
  .sidemenu-item.active { background: var(--accent-soft); color: var(--accent); }
  .sidemenu-item svg { width: 20px; height: 20px; flex-shrink: 0; opacity: .9; }
  .sidemenu-item .chev { margin-left: auto; opacity: .35; font-size: 16px; }
  .sidemenu-item .soon {
    margin-left: auto; font-size: 11px; font-weight: 600; color: var(--accent);
    background: var(--accent-soft); padding: 2px 8px; border-radius: 8px;
  }
  .sidemenu-footer { padding-top: 6px; border-top: 0.5px solid var(--border); margin-top: 4px; }
  .sidemenu-item.logout { color: var(--danger); }

  /* Content */
  #view {
    flex: 1; padding: 12px 12px calc(var(--nav-height) + var(--safe-bottom) + 16px);
    max-width: 560px; margin: 0 auto; width: 100%;
  }

  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: calc(var(--nav-height) + var(--safe-bottom));
    padding-bottom: var(--safe-bottom);
    background: var(--surface); border-top: 0.5px solid var(--border);
    display: flex; z-index: 30;
  }
  .bottom-nav button {
    flex: 1; border: none; background: transparent; color: var(--text-muted);
    font-size: 10px; font-weight: 500; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; cursor: pointer;
    font-family: inherit; padding: 6px 2px 4px; min-height: 44px;
  }
  .bottom-nav button.active { color: var(--accent); }
  .bottom-nav button svg { width: 24px; height: 24px; }

  h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 2px; }
  h2 { font-size: 13px; font-weight: 600; margin: 20px 0 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; }
  .page-desc { color: var(--text-secondary); font-size: 14px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin: 14px 0 6px; }
  input, select, textarea, button { font-family: inherit; font-size: 16px; }

  input[type="text"], input[type="email"], input[type="password"], input[type="number"],
  input[type="datetime-local"], input[type="search"], input[type="file"], select, textarea {
    width: 100%; padding: 12px 14px; border-radius: var(--r-sm);
    border: 1.5px solid var(--border-strong); background: var(--surface); color: var(--text);
  }
  input::placeholder, textarea::placeholder { color: var(--text-muted); opacity: 1; }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input:disabled, select:disabled, textarea:disabled { opacity: .55; cursor: not-allowed; background: var(--surface-2); }
  textarea { resize: vertical; min-height: 84px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 18px; border-radius: var(--r-sm); border: none;
    font-weight: 600; font-size: 16px; cursor: pointer; width: 100%; margin-top: 14px;
    letter-spacing: -.01em; min-height: 48px; transition: transform .12s, opacity .15s, background .15s;
  }
  .btn:active:not(:disabled) { transform: scale(.98); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:active:not(:disabled) { background: var(--accent-hover); }
  .btn-secondary {
    background: var(--surface); color: var(--text);
    border: 1.5px solid var(--border-strong);
  }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-ghost {
    background: transparent; color: var(--accent); width: auto;
    padding: 8px 12px; font-size: 15px; font-weight: 500; margin-top: 0;
    min-height: 44px; box-shadow: none;
  }
  .btn-sm {
    width: auto; padding: 8px 14px; font-size: 14px; margin-top: 0;
    border-radius: var(--r-sm); min-height: 36px;
  }

  .card {
    background: var(--surface); border-radius: var(--r-lg);
    padding: 14px 16px; margin-bottom: 8px; box-shadow: var(--shadow);
    border: 0.5px solid var(--border);
  }
  .card.click { cursor: pointer; }
  .card.click:active { transform: scale(.985); background: var(--surface-2); }

  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .gap { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .muted { color: var(--text-secondary); font-size: 14px; }
  .small { font-size: 12px; color: var(--text-muted); }

  .badge {
    display: inline-flex; align-items: center; padding: 4px 10px; border-radius: var(--r-pill);
    font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent); white-space: nowrap;
  }
  .badge.bad { background: var(--danger-soft); color: var(--danger); }
  .badge.ok { background: var(--success-soft); color: var(--success); }
  .badge.warn { background: var(--warning-soft); color: var(--warning); }
  .badge.neutral { background: var(--surface-2); color: var(--text-secondary); border: 1px solid var(--border); }

  .alert { padding: 12px 14px; border-radius: var(--r-sm); font-size: 14px; margin-bottom: 12px; line-height: 1.4; }
  .alert-info { background: var(--warning-soft); color: #8A5A00; }
  [data-theme="dark"] .alert-info { color: #F5D76E; }
  .alert-error { background: var(--danger-soft); color: var(--danger); }
  .alert-success { background: var(--success-soft); color: var(--success); word-break: break-all; }

  .empty { text-align: center; padding: 48px 24px; color: var(--text-muted); }
  .empty-icon {
    width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 18px;
    background: var(--accent-soft); display: flex; align-items: center; justify-content: center; color: var(--accent);
  }
  .empty-icon svg { width: 32px; height: 32px; }
  .empty-title { font-size: 16px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
  .empty-desc { font-size: 14px; max-width: 240px; margin: 0 auto; color: var(--text-muted); }

  .choices { display: flex; gap: 10px; }
  .choice {
    flex: 1; padding: 14px; border-radius: var(--r-sm);
    border: 1.5px solid var(--border-strong); background: var(--surface);
    color: var(--text); font-weight: 600; font-size: 16px; cursor: pointer;
    font-family: inherit; min-height: 48px;
  }
  .choice.on.yes { background: var(--success); color: #fff; border-color: var(--success); }
  .choice.on.no { background: var(--danger); color: #fff; border-color: var(--danger); }
  .choice:disabled { opacity: .5; cursor: default; }

  .flag { color: var(--danger); font-size: 13px; font-weight: 600; margin-top: 8px; }
  .photo { max-width: 100%; border-radius: 12px; margin-top: 10px; }
  .itemrow { border-top: 0.5px solid var(--border); padding-top: 16px; margin-top: 16px; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip {
    padding: 7px 14px; border-radius: var(--r-pill); border: 1.5px solid var(--border-strong);
    background: var(--surface); color: var(--text-secondary); font-size: 13px; font-weight: 500;
    cursor: pointer; font-family: inherit; min-height: 32px;
  }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .toast {
    position: fixed; left: 16px; right: 16px;
    bottom: calc(var(--nav-height) + var(--safe-bottom) + 14px);
    background: #2C2C2E; color: #fff; padding: 14px 18px; border-radius: 12px;
    z-index: 100; font-size: 15px; font-weight: 500; box-shadow: var(--shadow-lg);
    transform: translateY(24px); opacity: 0; transition: transform .28s, opacity .28s;
    pointer-events: none; text-align: center;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.bad { background: var(--danger); }

  .stub-icon {
    width: 68px; height: 68px; margin: 0 auto 18px; background: var(--accent-soft);
    border-radius: 18px; display: flex; align-items: center; justify-content: center; color: var(--accent);
  }
  .stub-icon svg { width: 30px; height: 30px; }
  .hidden { display: none !important; }
  .back-btn { margin-bottom: 8px; }
  .divider { height: 0.5px; background: var(--border); margin: 20px 0; }
  .section-label {
    font-size: 13px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .03em; padding: 8px 4px 6px;
  }
  .skeleton {
    background: linear-gradient(90deg, var(--border) 25%, var(--surface-2) 50%, var(--border) 75%);
    background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 10px; height: 16px;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* List rows */
  .list-group {
    background: var(--surface); border-radius: var(--r-lg); overflow: hidden;
    box-shadow: var(--shadow); border: 0.5px solid var(--border);
  }
  .list-row { position: relative; overflow: hidden; border-bottom: 0.5px solid var(--border); }
  .list-row:last-child { border-bottom: none; }
  .list-row-inner {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    background: var(--surface); position: relative; z-index: 1;
    transition: transform .2s var(--ease); touch-action: pan-y; min-height: 56px;
  }
  .list-row-actions { position: absolute; right: 0; top: 0; bottom: 0; display: flex; z-index: 0; }
  .list-row-actions button {
    border: none; color: #fff; font-weight: 600; font-size: 14px;
    padding: 0 20px; cursor: pointer; font-family: inherit; min-width: 88px;
  }
  .list-row-actions .act-delete { background: var(--danger); }
  .list-row.open .list-row-inner { transform: translateX(-88px); }

  .swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .swatch {
    width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent;
    cursor: pointer; box-shadow: var(--shadow-md);
  }
  .swatch.on { border-color: var(--text); }

  .emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 10px; }
  .emoji-grid button {
    aspect-ratio: 1; border: 1.5px solid var(--border); border-radius: 12px;
    background: var(--surface); font-size: 22px; cursor: pointer; min-height: 44px;
  }
  .emoji-grid button.on { border-color: var(--accent); background: var(--accent-soft); }

  .avatar-lg {
    width: 72px; height: 72px; border-radius: 50%; background: var(--accent);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 28px; overflow: hidden; flex-shrink: 0;
  }
  .avatar-lg img { width: 100%; height: 100%; object-fit: cover; }

  .fab {
    position: fixed; right: 16px; bottom: calc(var(--nav-height) + var(--safe-bottom) + 16px);
    width: 56px; height: 56px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; font-size: 28px; font-weight: 300; line-height: 1;
    box-shadow: 0 4px 16px var(--accent-glow); cursor: pointer; z-index: 25;
    display: flex; align-items: center; justify-content: center;
  }
  .fab:active { transform: scale(.94); background: var(--accent-hover); }

  .float-back {
    position: sticky; top: calc(var(--header-height) + 8px); z-index: 15;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: var(--r-pill); border: 1px solid var(--border);
    background: var(--surface); color: var(--accent); font-weight: 600; font-size: 14px;
    font-family: inherit; box-shadow: var(--shadow); cursor: pointer; margin-bottom: 12px;
    min-height: 36px;
  }

  .option-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .option-row input { flex: 1; }
  .choice-opt {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin-top: 8px;
    border-radius: var(--r-md); border: 1.5px solid var(--border-strong); background: var(--surface);
    cursor: pointer; font-weight: 500; min-height: 44px;
  }
  .choice-opt.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .star-btn {
    border: none; background: transparent; font-size: 20px; cursor: pointer;
    padding: 8px; line-height: 1; min-width: 44px; min-height: 44px;
  }

  .card {
    box-shadow: none;
  }
  .card.click:active { background: var(--surface-2); }
  .list-group { box-shadow: none; }
  .login-card { box-shadow: var(--shadow-md); }
  .icon-btn {

  .water-drop { width: 16px; height: 16px; border-radius: 50%; transform: translate(0,0) scale(0); background: var(--accent); will-change: transform; }
  .ws-pill { border-radius: 999px; will-change: transform, width; }
  .ws-arc { position: absolute; left: 14%; right: 14%; top: 7%; height: 38%; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,0)); opacity: .62; }
  .ws-dot { position: absolute; left: 17%; top: 17%; width: 9px; height: 6px; border-radius: 50%; background: #fff; transform: rotate(-24deg); }
  .ws-dot2 { position: absolute; left: calc(17% + 12px); top: calc(17% + 5px); width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: .8; }
  .ws-spark { width: 4px; height: 4px; border-radius: 50%; background: #fff; opacity: 0; }
  .bottom-nav button, .folder { z-index: 1; }
</style>
</head>
<body>
<div id="app">
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">✓</div>
      <h1>Чеклисты</h1>
      <p class="subtitle">Войдите в аккаунт</p>
      <label for="login-id">Email</label>
      <input type="email" id="login-id" placeholder="you@example.com" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
      <label for="password">Пароль</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      <button class="btn btn-primary" id="login-btn">Войти</button>
      <p class="small" style="margin-top:14px;text-align:center">Забыли пароль? Попросите администратора выдать новый.</p>
      <div id="login-error" class="alert alert-error hidden" style="margin-top:16px"></div>
    </div>
  </div>
  <div id="tfa-screen" class="hidden">
    <div class="login-card">
      <div class="login-logo">🔐</div>
      <h1>Подтверждение</h1>
      <p class="subtitle">Код из приложения-аутентификатора</p>
      <label for="tfa-code">Код</label>
      <input type="text" id="tfa-code" placeholder="000000" inputmode="numeric" autocomplete="one-time-code" maxlength="8">
      <button class="btn btn-primary" id="tfa-btn">Подтвердить</button>
      <button class="btn btn-ghost" id="tfa-back" style="width:100%;margin-top:12px;justify-content:center">← Назад</button>
      <div id="tfa-error" class="alert alert-error hidden" style="margin-top:16px"></div>
    </div>
  </div>
  <div id="app-screen" class="hidden">
    <header class="topbar">
      <button class="topbar-btn" id="menu-btn" aria-label="Меню">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="topbar-title" id="topbar-title">Чеклисты</div>
      <div class="topbar-actions" id="topbar-actions">
        <select id="ws-select" class="ws-select hidden"></select>
      </div>
    </header>
    <div class="folders" id="folders"></div>
    <main id="view"></main>
    <div class="dock" id="dock"><nav class="bottom-nav" id="bottom-nav"></nav><div class="orbs"><button type="button" class="search-orb plus-orb hidden" id="plus-orb" title="Добавить сотрудника"></button><button type="button" class="search-orb" id="search-orb" title="Поиск"></button></div></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script type="module">
const NGROK_URL = 'https://dullness-playpen-starlet.ngrok-free.dev'; // <--- ВАШ АДРЕС NGROK
const API_BASE = location.hostname.endsWith('github.io') ? NGROK_URL : '';
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const $ = (id) => document.getElementById(id);
let csrfToken = null;
const DEFAULT_LAYOUT = () => ({ top: ['all','tpl','people'], dock: ['all','settings'] });

const state = {
  me: null, workspaces: [], wsId: localStorage.getItem('wsId') || null,
  tab: 'all', theme: localStorage.getItem('theme') || 'light', accent: localStorage.getItem('accent') || 'blue'
};

const icons = {
  all: '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg>',
  settings: '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>',
  back: '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>'
};

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
function setView(...nodes) { $('view').replaceChildren(...nodes.flat(Infinity).filter(n => n && n.nodeType)); }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.className = 'toast show'; setTimeout(() => t.className = 'toast', 3000); }
function showScreen(id) { ['login-screen','tfa-screen','app-screen'].forEach(s => $(s).classList.toggle('hidden', s !== id)); }

function applyAppearance() {
  document.documentElement.setAttribute('data-theme', state.theme === 'dark' ? 'dark' : 'light');
  document.documentElement.setAttribute('data-accent', state.accent || 'blue');
}
applyAppearance();

function toLogin(msg) {
  csrfToken = null; state.me = null; localStorage.removeItem('token'); showScreen('login-screen');
  const el = $('login-error');
  if (msg) { el.textContent = msg; el.classList.remove('hidden'); } else el.classList.add('hidden');
}

async function api(method, path, body) {
  const headers = { 'ngrok-skip-browser-warning': '1' };
  const token = localStorage.getItem('token');
  if (token) headers['Authorization'] = `Bearer ${token}`;
  if (csrfToken) headers['x-csrf-token'] = csrfToken;
  if (body !== undefined) headers['content-type'] = 'application/json';

  const res = await fetch(API_BASE + path, {
    method, headers, body: body ? JSON.stringify(body) : undefined
  });
  const text = await res.text();
  let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) throw new Error(data?.message || res.statusText);
  return data;
}

$('login-btn').onclick = async () => {
  $('login-error').classList.add('hidden');
  const email = $('login-id').value.trim();
  const password = $('password').value;
  
  if (!email || !password) { toLogin('Заполните email и пароль'); return; }
  
  $('login-btn').disabled = true;
  try {
    // Отправляем только email и password!
    const data = await api('POST', '/auth/login', { email, password });
    if (data.twoFactorRequired) {
      showScreen('tfa-screen'); return;
    }
    if (data.sessionToken) localStorage.setItem('token', data.sessionToken);
    csrfToken = data.csrfToken || null; 
    $('password').value = '';
    
    // После входа запрашиваем профиль
    state.me = await api('GET', '/auth/me');
    csrfToken = state.me.csrfToken || csrfToken;
    showScreen('app-screen');
    go('all');
  } catch (e) { 
    toLogin(e.message); 
  } finally { 
    $('login-btn').disabled = false; 
  }
};

function go(tab) {
  state.tab = tab;
  $('menu-btn').style.display = tab === 'all' ? 'none' : '';
  if (tab !== 'all') {
    $('menu-btn').innerHTML = icons.back;
    $('menu-btn').onclick = () => go('all');
  }
  const screens = { all: renderAll, settings: renderSettings };
  if (screens[tab]) screens[tab]();
  
  // Нижнее меню
  const nav = $('bottom-nav');
  nav.innerHTML = '';
  const b1 = h('button', { class: tab === 'all' ? 'active' : '', onclick: () => go('all') }, icons.all);
  const b2 = h('button', { class: tab === 'settings' ? 'active' : '', onclick: () => go('settings') }, icons.settings);
  nav.append(b1, b2);
}

async function renderAll() {
  setView(h('h1', {}, 'Чеклисты'), h('p', { class: 'page-desc' }, 'Здесь будет список ваших чеклистов'), h('div', { class: 'empty' }, h('div', { class: 'empty-title' }, 'Пока пусто')));
}
async function renderSettings() {
  setView(h('h1', {}, 'Кабинет'), h('button', { class: 'btn btn-secondary', onclick: () => { localStorage.removeItem('token'); location.reload(); } }, 'Выйти'));
}

// Автовход при загрузке
(async () => {
  const token = localStorage.getItem('token');
  if (!token) { showScreen('login-screen'); return; }
  try {
    state.me = await api('GET', '/auth/me');
    csrfToken = state.me.csrfToken;
    showScreen('app-screen');
    go('all');
  } catch (e) {
    toLogin('Сессия истекла, войдите снова');
  }
})();
</script>
</body>
</html>
