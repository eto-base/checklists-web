<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Чеклисты</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; margin: 0; background: #f5f5f5; color: #222; }
        #app { max-width: 480px; margin: 0 auto; }
        h1 { font-size: 22px; margin: 0 0 16px; }
        label { display: block; font-size: 13px; color: #555; margin: 12px 0 4px; }
        input, button { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
        input:focus { outline: 2px solid #2481cc; border-color: transparent; }
        button { margin-top: 16px; background: #2481cc; color: #fff; border: none; font-weight: 600; cursor: pointer; }
        button:disabled { opacity: 0.6; cursor: default; }
        pre { background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 8px; font-size: 12px; overflow: auto; max-height: 240px; margin-top: 16px; white-space: pre-wrap; word-break: break-word; }
        .error { color: #c00; margin-top: 12px; font-size: 14px; background: #ffebee; padding: 10px; border-radius: 8px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Экран входа -->
        <div id="login-screen">
            <h1>Вход в чеклисты</h1>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="username">
            <label for="password">Пароль</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            <button id="login-btn">Войти</button>
            <div id="login-error" class="error hidden"></div>
        </div>

        <!-- Экран «Мои чеклисты» -->
        <div id="main-screen" class="hidden">
            <h1>Мои чеклисты</h1>
            <p>Вы вошли как <strong id="user-email"></strong>.</p>
            <pre id="user-json"></pre>
            <button id="logout-btn" style="background:#888;">Выйти</button>
        </div>
    </div>

    <script type="module">
        // Адрес сервера. Если страница открыта с самого сервера (localhost или ngrok),
        // запросы идут на тот же адрес. Если страница лежит на GitHub Pages,
        // используется адрес ngrok. Замените его, если ngrok выдал новый.
        const NGROK_URL = 'https://dullness-playpen-starlet.ngrok-free.dev';
        const API_BASE = location.hostname.endsWith('github.io') ? NGROK_URL : '';

        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        const $ = (id) => document.getElementById(id);
        let csrfToken = null;

        function showError(msg) {
            const el = $('login-error');
            el.textContent = msg;
            el.classList.remove('hidden');
        }
        function hideError() { $('login-error').classList.add('hidden'); }

        function showMain(user) {
            $('login-screen').classList.add('hidden');
            $('main-screen').classList.remove('hidden');
            $('user-email').textContent = user.email;
            $('user-json').textContent = JSON.stringify(user, null, 2);
        }
        function showLogin() {
            $('main-screen').classList.add('hidden');
            $('login-screen').classList.remove('hidden');
            csrfToken = null;
        }

        async function api(method, path, body) {
            const headers = { 'ngrok-skip-browser-warning': '1' };
            const token = localStorage.getItem('token');
            if (token) headers['Authorization'] = `Bearer ${token}`;
            if (csrfToken) headers['x-csrf-token'] = csrfToken;
            if (body !== undefined) headers['content-type'] = 'application/json';

            let res;
            try {
                res = await fetch(API_BASE + path, {
                    method,
                    headers,
                    credentials: 'include',
                    body: body === undefined ? undefined : JSON.stringify(body),
                });
            } catch (e) {
                throw new Error('Нет связи с сервером. Проверьте, что приложение и ngrok запущены, и что адрес ngrok не изменился.');
            }

            const text = await res.text();
            let data = null;
            try { data = text ? JSON.parse(text) : null; } catch { data = text; }

            if (!res.ok) {
                const msg = (data && (data.message || data.error)) || res.statusText || `HTTP ${res.status}`;
                throw new Error(Array.isArray(msg) ? msg.join(', ') : String(msg));
            }
            return data;
        }

        // Вход
        $('login-btn').onclick = async () => {
            hideError();
            const email = $('email').value.trim();
            const password = $('password').value;
            if (!email || !password) { showError('Заполните email и пароль'); return; }
            $('login-btn').disabled = true;
            try {
                const data = await api('POST', '/auth/login', { email, password });
                if (data.twoFactorRequired) {
                    showError('Включена 2FA. Пока не поддержано.');
                    return;
                }
                // Сохраняем токен (если сервер его отдаёт)
                if (data.sessionToken) localStorage.setItem('token', data.sessionToken);
                csrfToken = data.csrfToken || null;

                const me = await api('GET', '/auth/me');
                csrfToken = me.csrfToken || csrfToken;
                showMain(me);
            } catch (e) {
                showError(e.message);
            } finally {
                $('login-btn').disabled = false;
            }
        };

        // Выход
        $('logout-btn').onclick = async () => {
            try { await api('POST', '/auth/logout'); } catch {}
            localStorage.removeItem('token');
            showLogin();
        };

        // Автологин при загрузке, если токен уже есть
        (async () => {
            const token = localStorage.getItem('token');
            if (!token) { showLogin(); return; }
            try {
                const me = await api('GET', '/auth/me');
                csrfToken = me.csrfToken || null;
                showMain(me);
            } catch {
                localStorage.removeItem('token');
                showLogin();
            }
        })();
    </script>
</body>
</html>
